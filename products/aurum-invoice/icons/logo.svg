    <linearGradient id="aFlap" gradientUnits="userSpaceOnUse" x1="14" y1="108" x2="104" y2="48"><stop offset="0" stop-color="#D9A868"/><stop offset=".45" stop-color="#E8C28A"/><stop offset="1" stop-color="#F0CF9C"/></linearGradient>
