<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Aurum Invoice Studio">
  <defs>
    <linearGradient id="aFrame" gradientUnits="userSpaceOnUse" x1="6" y1="0" x2="113" y2="0"><stop offset="0" stop-color="#C98F4C"/><stop offset=".28" stop-color="#F4DBA8"/><stop offset=".55" stop-color="#E4BC7E"/><stop offset="1" stop-color="#C08A48"/></linearGradient>
    <linearGradient id="aFrameV" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="104"><stop offset="0" stop-color="#F1D3A0"/><stop offset=".35" stop-color="#D9AB6C"/><stop offset=".75" stop-color="#6B4A26"/><stop offset="1" stop-color="#3A2815"/></linearGradient>
