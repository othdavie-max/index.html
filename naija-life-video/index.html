<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#075e32}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.2" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="year" data-composition-id="year" data-composition-src="compositions/year.html" data-start="3.2" data-duration="3.8" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="mini" data-composition-id="mini" data-composition-src="compositions/mini.html" data-start="7.0" data-duration="4.0" data-track-index="3" data-width="1080" data-height="1920"></div>
      <div id="gold" data-composition-id="gold" data-composition-src="compositions/gold.html" data-start="11.0" data-duration="3.8" data-track-index="4" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="14.8" data-duration="5.2" data-track-index="5" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
